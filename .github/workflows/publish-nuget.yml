name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for MinVer

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Only stable v<major>.<minor>.<patch> tags are publishable."
          }

      - name: Validate build scripts and project inventory
        shell: pwsh
        run: ./scripts/Test-BuildScripts.ps1

      - name: Build, test and pack supported packages
        shell: pwsh
        run: ./scripts/Build.ps1 -Pack -OutputDirectory ./nupkgs -Version ($env:GITHUB_REF_NAME.Substring(1))

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
