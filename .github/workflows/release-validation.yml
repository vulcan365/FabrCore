name: Release validation

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'FabrCore-CI-Only_2026!'
        ports:
          - 1433/tcp
        options: >-
          --health-cmd="SQLCMDPASSWORD='FabrCore-CI-Only_2026!' /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      PACKAGE_VERSION: ${{ inputs.version || '2.0.0-ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate build scripts
        shell: pwsh
        run: ./scripts/Test-BuildScripts.ps1
      - name: Validate documentation links
        shell: pwsh
        run: ./scripts/Test-Documentation.ps1
      - name: Build, test and pack
        shell: pwsh
        run: ./scripts/Build.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory ./artifacts/packages
      - name: Validate SQL and actual package consumers
        shell: pwsh
        env:
          TEST_SQL_CONTAINER: ${{ job.services.sql.id }}
        run: ./scripts/Test-ReleaseSql.ps1 -Container $env:TEST_SQL_CONTAINER -PackageDirectory ./artifacts/packages -Version $env:PACKAGE_VERSION
      - name: Validate scripting workers
        # Real worker tests need the SDK and package access; the default offline filter excludes them.
        shell: pwsh
        run: dotnet test src/FabrCore.Scripting.Tests/FabrCore.Scripting.Tests.csproj --configuration Release --filter 'TestCategory=Integration' --logger 'trx;LogFileName=scripting.trx' --results-directory artifacts/test-results/scripting
      - name: Validate SampleApp scripting example
        shell: pwsh
        run: dotnet test samples/FabrCore.SampleApp.Tests/FabrCore.SampleApp.Tests.csproj --configuration Release --filter 'TestCategory=Integration' --logger 'trx;LogFileName=sample-scripting.trx' --results-directory artifacts/test-results/sample-scripting
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: error
      - name: Retain validated packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
