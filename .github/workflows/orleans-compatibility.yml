name: Orleans compatibility

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start isolated test SQL instance
        run: sqllocaldb start MSSQLLocalDB
      - name: Validate contracts, storage compatibility and SQL streams
        env:
          FABRCORE_SQL_TEST_CONNECTION_STRING: 'Server=(localdb)\MSSQLLocalDB;Integrated Security=true;TrustServerCertificate=true'
        run: dotnet test src/FabrCore.Host.Tests/FabrCore.Host.Tests.csproj --filter "FullyQualifiedName~OrleansStorageCompatibilityTests|FullyQualifiedName~OrleansProviderTests|FullyQualifiedName~OrleansSqlStreamingTests" --configuration Release
      - name: Validate Orleans client
        run: dotnet test src/FabrCore.Client.Orleans.Tests/FabrCore.Client.Orleans.Tests.csproj --configuration Release
      - name: Build telemetry sample
        run: dotnet build samples/FabrCore.SampleApp.ServiceDefaults/FabrCore.SampleApp.ServiceDefaults.csproj --configuration Release
